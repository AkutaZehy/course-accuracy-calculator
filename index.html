<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>course-accuracy-calculator</title>
<style>
  @font-face {
    font-family: 'SourceHanSansLite';
    src: url('resources/SourceHanSansLite.ttf');
    font-weight: 100 1000;
  }
  :root {
    color-scheme: dark;
    --bg: #101113;
    --ink: #e8e8e4;
    --dim: #8a8d92;
    --hair: #26292d;
    --hair-strong: #3a3e44;
    --accent: #da291c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'SourceHanSansLite', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-weight: 400;
    background: var(--bg); color: var(--ink);
    margin: 0; padding: 48px 32px; max-width: 1080px; margin-inline: auto;
    font-size: 16px; line-height: 1.65;
  }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.2; }
  h1 .sub { font-size: 15px; font-weight: 400; color: var(--dim); margin-left: 14px; letter-spacing: 0.08em; }
  .sec { font-size: 14px; font-weight: 400; color: var(--dim); letter-spacing: 0.18em;
    border-bottom: 1px solid var(--hair-strong); padding-bottom: 7px; margin: 48px 0 16px; }
  .sec b { color: var(--ink); font-weight: 400; margin-right: 10px; }

  #dropzone { border: 1px dashed var(--hair-strong); padding: 28px; text-align: center; margin-top: 20px; }
  #dropzone.over { border-color: var(--accent); }
  #dropzone p { margin: 4px 0; color: var(--dim); }
  /* 竖排：导入长文件名只影响自己的行，不推挤另一项 */
  label.file { display: flex; align-items: baseline; width: fit-content; max-width: 100%;
    margin: 10px auto; padding: 8px 18px; border: 1px solid var(--hair-strong); cursor: pointer; }
  label.file:hover { border-color: var(--ink); }
  label.file input { display: none; }
  label.file span.name { color: var(--dim); margin-left: 10px; font-size: 14px;
    max-width: 34em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #results { display: none; }
  .meta-line { margin: 3px 0; }
  #md5.ok { color: var(--dim); } #md5.bad { color: var(--accent); font-weight: 700; }

  table { border-collapse: collapse; margin: 12px 0; width: 100%; }
  th { font-weight: 400; font-size: 13px; color: var(--dim); letter-spacing: 0.12em;
    text-align: left; border-bottom: 1px solid var(--hair-strong); padding: 0 14px 7px 0; }
  td { border-bottom: 1px solid var(--hair); padding: 10px 14px 10px 0; vertical-align: top; }
  td.num { font-variant-numeric: tabular-nums; }
  .sub { color: var(--dim); font-size: 14px; }
  .hint { color: var(--dim); font-size: 14px; }

  .mod-chip { display: inline-block; padding: 4px 12px; border: 1px solid var(--hair-strong);
    font-size: 14px; margin: 2px 8px 2px 0; letter-spacing: 0.04em; }
  .mod-chip.ease, .mod-chip.uncontrollable, .mod-chip.auto { border-color: var(--accent); color: #ff6f63; }
  .mod-chip.rate { border-color: var(--hair-strong); color: var(--dim); }

  .detail-card { border: 1px solid var(--hair); padding: 16px 20px; margin: 12px 0; }
  .detail-title { font-weight: 700; margin-bottom: 8px; }

  .verdict { padding: 10px 14px; border: 1px solid var(--hair-strong); margin: 6px 0; }
  .verdict.pass { border-left: 3px solid var(--ink); }
  .verdict.fail { border-left: 3px solid var(--accent); color: var(--ink); }
  .verdict.fail b { color: var(--accent); }
  #pack-name { font-weight: 700; }

  button { background: none; color: var(--ink); border: 1px solid var(--hair-strong);
    padding: 9px 22px; cursor: pointer; margin-right: 10px; font-family: inherit; font-size: 15px; }
  button:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
</style>
</head>
<body>
<h1>course-accuracy-calculator<span class="sub">stb / stb-SV2 / lzr / Malody C判 / B判</span></h1>

<div id="dropzone">
  <p>把 <b>.osu 谱面</b> 和 <b>.osr 回放</b> 两个文件拖到这里（或分别选择）</p>
  <label class="file">选择谱面 .osu<span class="name" id="osu-name"></span><input type="file" id="osu-input" accept=".osu"></label>
  <label class="file">选择回放 .osr<span class="name" id="osr-name"></span><input type="file" id="osr-input" accept=".osr"></label>
</div>

<div id="results">
  <div class="sec"><b>01</b>文件</div>
  <p class="meta-line" id="map-info"></p>
  <p class="meta-line" id="map-meta"></p>
  <p class="meta-line" id="replay-info"></p>
  <p class="meta-line" id="mods-line"></p>
  <p class="meta-line" id="md5"></p>

  <div class="sec"><b>02</b>准确率（整谱）</div>
  <table><thead><tr><th>判定体系</th><th>acc</th><th>判定数</th></tr></thead><tbody id="acc-body"></tbody></table>

  <div class="sec"><b>03</b>细值（判定区间与计数）<span class="hint" style="margin-left:12px">段位包按其门槛体系；未分类谱显示全部体系</span></div>
  <div id="details"></div>

  <div class="sec"><b>04</b>lzr 对账（重判 vs 回放内嵌计数）</div>
  <div id="reconcile"></div>

  <div class="sec"><b>05</b>段位判定</div>
  <div id="pack-box">
    <p>段位包：<span id="pack-name"></span></p>
    <p class="meta-line">难度：<span id="pack-diff"></span></p>
    <div id="verdicts"></div>
    <div class="sec"><b>06</b>分段（单曲 / 累计 sumup）</div>
    <div id="sections"></div>
  </div>

  <div class="sec"><b>07</b>导出</div>
  <button id="copy-text">复制文本报告</button>
  <button id="copy-json">复制 JSON</button>
</div>

    tags: (meta.Tags || '').toLowerCase(),
    mode: +(meta.Mode || 0),
    keys,
    od: +meta.OverallDifficulty || 0,
    beatmapId: +(meta.BeatmapID || 0),
    setId: +(meta.BeatmapSetID || 0),
    notes,
  };
}


// ==== src/engines.js ====
// 五体系重判引擎：对齐（含 Mirror/变速）→ 判定 → acc/分段/过段。
// 判定语义来源见 TASK.md §2：osu wiki + ppy/osu ManiaHitWindows.cs + 用户定版。

function perfectWindow(od) { return od <= 5 ? 22.4 - 0.6 * od : 24.9 - 1.1 * od; }

// 回放帧时间 = 谱面(track)时间（与倍率无关，实证：对齐恒为恒等映射最优）。
// 倍率来源（优先级）：.osr 尾块 LegacyReplaySoloScoreInfo 的 mods.settings.speed_change
// （官方回放设计，Celestial 实测 0.7 且位掩码为 0）＞ 位掩码默认（DT/NC=1.5、HT=0.75，
// 适用无尾块的 stable 回放）＞ 1。
// 窗口（track 时间）：三套 osu 引擎 ×rate（lazer 源码 speedMultiplier；stable 墙钟固定窗
// 折算到 track 亦为 ×rate）；Malody 用基础值（文章"1.5×速→窗×2/3"为墙钟口径，track 下抵消）。
function osuWindows(engine, od, rate) {
  // MAX 窗：stb 与 sv2 用 stable 固定 ±16（wiki Hold_note：ScoreV2 只改头尾分判+尾×1.5，不改基础窗）；
  // lzr 用 lazer 分段线性窗（ppy/osu ManiaHitWindows）
  const base = {
    p: engine === 'lzr' ? perfectWindow(od) : 16,
    g: 64 - 3 * od, gd: 97 - 3 * od, ok: 127 - 3 * od, meh: 151 - 3 * od, miss: 188 - 3 * od,
  };
  const f = x => Math.floor(x * rate) + 0.5;
  return { p: f(base.p), g: f(base.g), gd: f(base.gd), ok: f(base.ok), meh: f(base.meh), miss: f(base.miss) };
}

// Malody V 判定表·Standard 组（2026-10-05 用户提供实测表，萌百 A-E 表整表弃用——其 B/C/D 列实为本表 C/D/E 列错标）：
// 五列 A-EASY 64/104/149/191+ · B-EASY+ 54/94/139/181+ · C-NORMAL 44/84/129/171+ · D-NORMAL+ 36/76/121/163+ · E-HARD 28/68/113/155+
// C判（电脑默认）= C-NORMAL 列，B判（手机默认）= B-EASY+ 列；MISS 带 + 表示至少该宽
const MALODY_TABLE = {
  C: { best: 44, cool: 84, good: 129, miss: 171 },
  B: { best: 54, cool: 94, good: 139, miss: 181 },
};
function malodyWindows(level, rate) {
  // Malody 判定窗为墙钟口径（文章：1.5×速→×2/3）；回放是 track 时间，折算后用基础值
  void rate;
  const w = MALODY_TABLE[level];
  return { best: w.best, cool: w.cool, good: w.good, miss: w.miss };
}

function judgeOsuOffset(offset, w) {
  const a = Math.abs(offset);
  if (a <= w.p) return 'p';
  if (a <= w.g) return 'g';
  if (a <= w.gd) return 'gd';
  if (a <= w.ok) return 'ok';
  if (a <= w.meh) return 'meh';
  return 'miss';
}

// lazer 尾判（DrawableHoldNoteTail 语义）：首次落在 ±1.5×miss 内的释放，
// 偏移 /1.5 后按普通窗判定；此前出现过释放（远早于尾）= hold 断裂 → 封顶 MEH；
// 无合格释放 → miss（含持穿后超窗晚释放）。
function tailJudgement(n, w) {
  if (n.press === null || n.relIdx < 0 || !n.rels) return 'miss';
  const tailMiss = 1.5 * w.miss;
  let broken = false;
  for (let i = n.relIdx; i < n.rels.length; i++) {
    const off = n.rels[i] - n.end;
    if (off < -tailMiss) { broken = true; continue; }
    if (off > tailMiss) break;
    let j = judgeOsuOffset(off / 1.5, w);
    if (broken && j !== 'meh' && j !== 'miss') j = 'meh';
    return j;
  }
  return 'miss';
}

// 变速与镜像折算后的 play time 谱面物件（idx = 排序后原谱物件序号）
function prepChart(beatmap, rate, mirror) {
  // 回放 = track 时间，note 不折算；rate 仅影响判定窗口（见 osuWindows）；Mirror 翻转轨道
  void rate;
  return beatmap.notes.map((n, idx) => ({
    idx,
    chartT: n.t,
    col: mirror ? beatmap.keys - 1 - n.col : n.col,
    t: n.t,
    end: n.ln ? n.end : undefined,
    ln: n.ln,
  }));
}

// 每轨对齐，按 lazer OrderedHitPolicy（notelock）语义：
//   note i 的可击范围 = [t_i − miss, min(t_i + miss, t_{i+1}))（下一 note 的开始时间截断；
//   轨内最后一个 note 上界为 t+miss）；press 依序给范围内最早的未判 note；
//   已判 note 的 press 顺延给下一 note（若落其窗内）；无人可击的 press 忽略；
//   未击 note 在 t+miss 自动 miss。LN 头另受"尾部晚窗后不可再起手"守卫。
// LN 尾判按 lazer 源码语义（DrawableHoldNote/OnReleased + DrawableHoldNoteTail）：
//   尾 = 首次"落在 ±1.5×miss 内的释放"的偏移 /1.5 后按普通窗判定；
//   头未中或 body 断裂（释放远早于尾）→ 封顶 MEH；无合格释放 → miss；
//   持穿后晚释放按偏移正常判（不自动 PERFECT）。
function align(alignedNotes, presses, releases, missWin) {
  const cols = new Map();
  for (const n of alignedNotes) {
    if (!cols.has(n.col)) cols.set(n.col, { notes: [], press: [], rel: [] });
    cols.get(n.col).notes.push(n);
  }
  for (const e of presses) { const c = cols.get(e.col); if (c) c.press.push(e.t); }
  for (const e of releases) { const c = cols.get(e.col); if (c) c.rel.push(e.t); }

  for (const { notes, press, rel } of cols.values()) {
    const judged = new Array(notes.length).fill(false);
    const nextStart = notes.map((n, i) => (i + 1 < notes.length ? notes[i + 1].t : Infinity));
    let cursor = 0;
    for (const pt of press) {
      // 推进：已判的、或可击范围已结束的（min(t+miss, next) ≤ pt）不再接收
      while (cursor < notes.length && (judged[cursor] || Math.min(notes[cursor].t + missWin, nextStart[cursor]) <= pt)) cursor++;
      if (cursor >= notes.length) continue;
      // 从 cursor 起找首个未判且 pt ∈ [t−miss, min(t+miss, next)) 的 note
      let j = -1;
      for (let k = cursor; k < notes.length; k++) {
        if (judged[k]) continue;
        if (pt < notes[k].t - missWin) break; // 再往后更晚，窗不可能覆盖
        if (pt >= Math.min(notes[k].t + missWin, nextStart[k])) continue; // 该 note 范围已过但未自动 miss（截断情形），看下一個
        if (notes[k].ln && pt > notes[k].end + 1.5 * missWin) continue; // LN 尾部晚窗守卫
        j = k; break;
      }
      if (j === -1) continue;
      judged[j] = true;
      const n = notes[j];
      n.press = pt;
      if (n.ln) {
        let lo = 0, hi = rel.length;
        while (lo < hi) { const mid = (lo + hi) >> 1; if (rel[mid] < pt) lo = mid + 1; else hi = mid; }
        n.relIdx = lo;
        n.rels = rel;
        n.release = lo < rel.length ? rel[lo] : null;
      }
    }
  }
  for (const n of alignedNotes) if (n.press === undefined) { n.press = null; n.relIdx = -1; }
}

// —— 判定：每个物件产出 0~2 条判定记录 {idx, slot, j} ——

function judgeOsuSystem(notes, w, engine) {
  const recs = [];
  const push = (idx, slot, j) => recs.push({ idx, slot, j });
  for (const n of notes) {
    if (!n.ln) {
      push(n.idx, 's', n.press === null ? 'miss' : judgeOsuOffset(n.press - n.t, w));
    } else if (engine === 'stb') {
      if (n.press === null) { push(n.idx, 's', 'miss'); continue; }
      const headErr = n.press - n.t;
      const tailErr = n.release - n.end; // 尾偏移锚定 LN 结束时间（曾误锚头时间致全体 MEH，2026-10-05 修复）
      const sumErr = headErr + tailErr; // 头+尾偏移之和（用户定版：合并单判，梯级 ×2.x 即均值口径）
      if (n.release > n.end + w.meh) { push(n.idx, 's', 'miss'); continue; }
      const ladder = [['p', 1.2, 2.4], ['g', 1.1, 2.2], ['gd', 1.0, 2.0], ['ok', 1.0, 2.0]];
      let j = 'meh';
      for (const [name, f1, f2] of ladder) {
        if (Math.abs(headErr) <= f1 * w[name] && Math.abs(sumErr) <= f2 * w[name]) { j = name; break; }
      }
      // 中途弃条封顶 MEH：提前量超过 MEH 窗才算断条（对称于晚松 >end+MEH=miss）；
      // 曾误用 release<end 全判 MEH——把提前 2~139ms 的正常尾判全打成断条（2026-10-05 修复）
      if (n.release < n.end - w.meh) j = 'meh';
      push(n.idx, 's', j);
    } else {
      // sv2 / lzr：头尾独立双判（lazer 源码语义）
      push(n.idx, 'h', n.press === null ? 'miss' : judgeOsuOffset(n.press - n.t, w));
      push(n.idx, 't', tailJudgement(n, w));
    }
  }
  return recs;
}

function judgeMalodySystem(notes, w) {
  const recs = [];
  const judge = off => {
    const a = Math.abs(off);
    if (a <= w.best) return 'best';
    if (a <= w.cool) return 'cool';
    if (a <= w.good) return 'good';
    return 'miss';
  };
  for (const n of notes) {
    if (!n.ln) {
      recs.push({ idx: n.idx, slot: 's', j: n.press === null ? 'miss' : judge(n.press - n.t) });
    } else {
      recs.push({ idx: n.idx, slot: 'h', j: n.press === null ? 'miss' : judge(n.press - n.t) });
      const tj = n.press === null || n.release === null
        ? 'miss'
        : n.release >= n.end ? 'best' : judge(n.release - n.end);
      recs.push({ idx: n.idx, slot: 't', j: tj });
    }
  }
  return recs;
}

function countOsu(recs) {
  const c = { p: 0, g: 0, gd: 0, ok: 0, meh: 0, miss: 0 };
  for (const r of recs) c[r.j]++;
  return c;
}
function countMalody(recs) {
  const c = { best: 0, cool: 0, good: 0, miss: 0 };
  for (const r of recs) c[r.j]++;
  return c;
}

function osuAcc(engine, c) {
  const n = c.p + c.g + c.gd + c.ok + c.meh + c.miss;
  // 权重：stb=ScoreV1（MAX 300）；sv2 与 lzr 同为 ScoreV2 计分（MAX 305——wiki Accuracy 页
  // "ScoreV2 increases the weighting of rainbow 300s to 305"；lazer 源码 ManiaScoreProcessor
  // GetBaseScoreForResult(Perfect)=305，2026-10-05 修正，此前 320 系讹传并无出处）
  const num = engine === 'stb'
    ? 300 * (c.p + c.g) + 200 * c.gd + 100 * c.ok + 50 * c.meh
    : 305 * c.p + 300 * c.g + 200 * c.gd + 100 * c.ok + 50 * c.meh;
  const den = engine === 'stb' ? 300 * n : 305 * n;
  return { n, acc: den ? num / den : 0 };
}

function malodyAcc(c) {
  const n = c.best + c.cool + c.good + c.miss;
  return { n, acc: n ? (c.best + 0.75 * c.cool + 0.4 * c.good) / n : 0 };
}

// —— 分段（chart time）——
// 已知包固定四曲三空隙：空隙多于 3 处时取**彼此时长最接近**的 3 处（簇选择，并列取四段方差最小）。
// 依据 748 张 course 语料实测（2026-10-03）：同一张图内曲间空隙彼此接近、曲内长 break 偏离该簇
// （FINAL-ETA 曲间 6.2~7.0s vs 曲内 11.0s；REFORM 4th 曲间 4.6~5.3s vs 曲内 10.7~11.6s）；
// 而曲间标称随时包/图在 4.4~19.9s 漂移（LN v2 4.4s、Signicial Theta 18~20s），固定锚点不可行。
// 未知 Course/Unknown Course 曲目数不固定（3/5 首皆可）：全量空隙各切一段。

const GAP_MS = 4000;

function buildSeg(starts, gapIdx) {
  const b = [0, ...gapIdx, starts.length];
  return {
    split: true,
    sections: b.slice(0, -1).map((_, i) => ({ from: b[i], to: b[i + 1] - 1 })),
    gaps: gapIdx.map(g => starts[g] - starts[g - 1]),
  };
}

function findGaps(starts, thresholdMs) {
  const gapIdx = [];
  for (let i = 1; i < starts.length; i++) {
    if (starts[i] - starts[i - 1] > thresholdMs) gapIdx.push(i);
  }
  return gapIdx;
}

function pickCluster3(starts, gapIdx) {
  if (gapIdx.length <= 3) return gapIdx;
  const len = g => starts[g] - starts[g - 1];
  let best = null;
  const rec = (from, chosen) => {
    if (chosen.length === 3) {
      const lens = chosen.map(len);
      const spread = Math.max(...lens) - Math.min(...lens);
      const b = [0, ...chosen, starts.length];
      const spans = [0, 1, 2, 3].map(s => starts[b[s + 1] - 1] - starts[b[s]]);
      const mean = (spans[0] + spans[1] + spans[2] + spans[3]) / 4;
      const varr = spans.reduce((a, x) => a + (x - mean) ** 2, 0);
      if (!best || spread < best.spread || (spread === best.spread && varr < best.varr)) {
        best = { spread, varr, chosen };
      }
      return;
    }
    for (let i = from; i <= gapIdx.length - (3 - chosen.length); i++) rec(i + 1, [...chosen, gapIdx[i]]);
  };
  rec(0, []);
  return best.chosen;
}

function segment(beatmap, thresholdMs = GAP_MS) {
  const starts = beatmap.notes.map(n => n.t);
  const gapIdx = findGaps(starts, thresholdMs);
  if (!gapIdx.length) return { split: false, sections: [{ from: 0, to: starts.length - 1 }], gaps: [] };
  return buildSeg(starts, gapIdx);
}

// —— 段位包 ——
// name 为展示名；match 收小写化的 title/creator。
// REFORM FINAL 两变体同标题族，按标题 "(ext" 或 mapper CloverWisp 区分（Ext. 须先于 FINAL 判）。

const PACKS = [
  {
    id: 'malody3', name: 'Malody 4K Dan v3',
    match: t => t.includes('malody 4k regular dan'),
    thresholds: [{ sys: 'mc', min: 0.95, note: 'C判（电脑判）≥95%' }, { sys: 'mb', min: 0.95, note: 'B判（手机判）≥95%' }],
  },
  {
    id: 'reform-ext', name: 'osu!mania 4K Dan ~ REFORM ~ FINAL (Ext.) (CloverWisp)',
    match: (t, c) => t.includes('dan ~ reform') && t.includes('final') && (t.includes('(ext') || c.includes('cloverwisp')),
    thresholds: [{ sys: 'stb', min: 0.96, note: 'REFORM 96%（intro 95%，FINAL 沿用）' }],
  },
  {
    id: 'reform-final', name: 'osu!mania 4K Dan ~ REFORM ~ FINAL (Thaumiel)',
    match: t => t.includes('dan ~ reform') && t.includes('final'),
    thresholds: [{ sys: 'stb', min: 0.96, note: 'REFORM 96%（intro 95%，FINAL 沿用）' }],
  },
  {
    id: 'reform', name: 'osu!mania 4K Dan ~ REFORM (DDMythical)',
    // 含 Thaumiel 等托管的 DDMythical 谱（如 "1st Pack (Thaumiel)"）——发布者≠作者，仍归 DDMythical
    match: t => t.includes('dan ~ reform'),
    thresholds: [{ sys: 'stb', min: 0.96, note: 'REFORM 96%（intro 95%）' }],
  },
  {
    id: 'signicial', name: "osu!mania 4K Dan: Signicial's Courses",
    match: t => t.includes('dan: signicial'),
    thresholds: [{ sys: 'stb', min: 0.96, note: 'Signicial 合格 96%（进阶/精通分档待细化）' }],
  },
  {
    id: 'ln2', name: 'osu!mania 4K LN Dan Courses v2',
    // 弱化：不带 v2 的 "4K LN Dan Courses - EXTRA -" 同门四曲谱（2026-10-03 用户定版）；
    // xfpsb "4K LN Advanced Dan Course Maps" 不含此子串，不受影响
    match: t => t.includes('4k ln dan courses'),
    thresholds: [{ sys: 'sv2', min: 0.97, note: 'LN v2 97%（ScoreV2 口径，2023-01-26 起）' }],
  },
  {
    id: 'celestial', name: 'Dan: Celestial',
    match: t => t.includes('dan: celestial'),
    thresholds: [{ sys: 'stb', min: 0.97, note: 'Celestial stable ≥97%' }, { sys: 'lzr', min: 0.96, note: 'Celestial lazer ≥96%' }],
    diffFromTitle: /dan:\s*celestial\s+-(.+?)-/i, // 全单曲包：难度取自标题（-Ascension I- → Ascension I）
  },
];

function matchPack(title, creator = '') {
  return PACKS.find(pk => pk.match(title.toLowerCase(), creator.toLowerCase())) || null;
}

// Course 分类（2026-10-03 口径）：
// 已知包 → pack；未知但带 Course 标识（词边界 Course/Dans 且含英文冒号或 ~，Dance 不误中）→ course；
// 无标识但有 >4s 空隙 → unknown-course；两者皆无 → unknown-regular（不分段）。
const COURSE_MARK = /\b(courses?|dans?)\b/i;

function categorize(title, creator, hasGaps) {
  const pack = matchPack(title, creator);
  if (pack) return { category: 'pack', pack, name: pack.name };
  if (COURSE_MARK.test(title) && /[:~]/.test(title)) {
    return { category: 'course', pack: null, name: 'Course · ' + title.trim() };
  }
  if (hasGaps) return { category: 'unknown-course', pack: null, name: 'Unknown Course' };
  return { category: 'unknown-regular', pack: null, name: 'Unknown Regular' };
}

// 难度名：默认取谱面 [Version]；Celestial 特例从标题取
function difficultyOf(cat, beatmap) {
  if (cat.pack && cat.pack.diffFromTitle) {
    const m = cat.pack.diffFromTitle.exec(beatmap.title);
    if (m) return m[1].trim();
  }
  return beatmap.version;
}

// 谱面级分类+分段（无需回放）：已知包取彼此最接近的 3 处空隙切四段，未知类按全量空隙，无空隙即单曲
function classify(beatmap) {
  const starts = beatmap.notes.map(n => n.t);
  const gapIdx = findGaps(starts, GAP_MS);
  const cat = categorize(beatmap.title, beatmap.creator, gapIdx.length > 0);
  const difficulty = difficultyOf(cat, beatmap);
  const seg = !gapIdx.length
    ? { split: false, sections: [{ from: 0, to: starts.length - 1 }], gaps: [] }
    : buildSeg(starts, cat.category === 'pack' ? pickCluster3(starts, gapIdx) : gapIdx);
  return { category: cat.category, pack: cat.pack, courseName: cat.name, difficulty, seg };
}

// —— 主入口 ——

function judge(beatmap, replay, modsInfo) {
  const mirror = modsInfo.mirror;
  // 倍率：osr 尾块 mods.settings.speed_change（lazer 官方回放设计）优先；
  // 无尾块（stable 回放）按位掩码默认——stable 的 DT/HT 本就是固定 1.5/0.75
  const rate = replay.scoreInfoRate != null ? replay.scoreInfoRate
    : modsInfo.list.includes('NC') || modsInfo.list.includes('DT') ? 1.5
      : modsInfo.list.includes('HT') ? 0.75 : 1;
  const notes = prepChart(beatmap, rate, mirror);
  const wAlign = osuWindows('lzr', beatmap.od, rate); // 最宽 miss 窗做对齐
  align(notes, replay.presses, replay.releases, wAlign.miss);

  const systems = {};
  for (const engine of ['stb', 'sv2', 'lzr']) {
    const w = osuWindows(engine, beatmap.od, rate);
    systems[engine] = { windows: w, recs: judgeOsuSystem(notes, w, engine) };
  }
  for (const lv of ['c', 'b']) {
    const w = malodyWindows(lv.toUpperCase(), rate);
    systems['m' + lv] = { windows: w, recs: judgeMalodySystem(notes, w) };
  }

  const acc = {};
  for (const engine of ['stb', 'sv2', 'lzr']) {
    const c = countOsu(systems[engine].recs);
    systems[engine].counts = c;
    acc[engine] = osuAcc(engine, c);
  }
  for (const lv of ['c', 'b']) {
    const c = countMalody(systems['m' + lv].recs);
    systems['m' + lv].counts = c;
    acc['m' + lv] = malodyAcc(c);
  }

  // 分类与分段：已知包固定四曲（空隙取彼此最接近的 3 处）；未知 Course/Unknown Course 全量空隙切段；
  // 无空隙 = 单曲；Unknown Regular 天然无空隙。
  const { pack, category, courseName, difficulty, seg } = classify(beatmap);
  const sectionStats = [];
  if (seg.split) {
    for (const s of seg.sections) {
      const set = new Set();
      for (let i = s.from; i <= s.to; i++) set.add(i);
      const row = { range: [s.from, s.to] };
      for (const k of Object.keys(systems)) {
        const recs = systems[k].recs.filter(r => set.has(r.idx));
        const c = k.startsWith('m') ? countMalody(recs) : countOsu(recs);
        row[k] = { counts: c, ...(k.startsWith('m') ? malodyAcc(c) : osuAcc(k, c)) };
      }
      sectionStats.push(row);
    }
  }

  return { pack, category, courseName, difficulty, systems, acc, seg, sectionStats, notes, effectiveRate: rate, rateFromScoreInfo: replay.scoreInfoRate != null };
}


// ==== src/ui.js ====
// UI 逻辑：文件读入 → MD5 校验 → 引擎计算 → 渲染。
// 本文件由 tools/build-ui.mjs 内联进 index.html（file:// 无法用 ES module）；
// 顶层 DOM 绑定带环境守卫，使整包可在 Node 冒烟测试中执行。
'use strict';

function md5(bytes) {
  // 公有领域算法的紧凑实现（Ronald Rivest MD5, RFC 1321）
  function rl(n, c) { return (n << c) | (n >>> (32 - c)); }
  function add(a, b) { return (a + b) | 0; }
  const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K = new Int32Array(64);
  for (let i = 0; i < 64; i++) K[i] = (Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296)) | 0;
  const padLen = (((bytes.length + 8) >> 6) + 1) << 6;
  const m = new Uint8Array(padLen);
  m.set(bytes);
  m[bytes.length] = 0x80;
  const bitLen = bytes.length * 8;
  const dv = new DataView(m.buffer);
  dv.setUint32(padLen - 8, bitLen >>> 0, true);
  dv.setUint32(padLen - 4, Math.floor(bitLen / 4294967296), true);
  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
  for (let off = 0; off < padLen; off += 64) {
    const M = new Int32Array(16);
    for (let i = 0; i < 16; i++) M[i] = dv.getInt32(off + i * 4, true);
    let A = a0, B = b0, C = c0, D = d0;
    for (let i = 0; i < 64; i++) {
      let F, g;
      if (i < 16) { F = (B & C) | (~B & D); g = i; }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = add(add(add(F, A), K[i]), M[g]);
      A = D; D = C; C = B;
      B = add(B, rl(F, S[i]));
    }
    a0 = add(a0, A); b0 = add(b0, B); c0 = add(c0, C); d0 = add(d0, D);
  }
  const out = new DataView(new ArrayBuffer(16));
  out.setInt32(0, a0, true); out.setInt32(4, b0, true); out.setInt32(8, c0, true); out.setInt32(12, d0, true);
  let hex = '';
  for (let i = 0; i < 16; i++) hex += (out.getUint8(i) >> 4).toString(16) + (out.getUint8(i) & 15).toString(16);
  return hex;
}

const SYS_LABELS = [
  ['stb', 'stb（stable / ScoreV1）'],
  ['sv2', 'stb + ScoreV2（MAX=305）'],
  ['lzr', 'lzr（lazer）'],
  ['mc', 'Malody C判（电脑判）'],
  ['mb', 'Malody B判（手机判）'],
];

function fmtAcc(x) { return (x * 100).toFixed(3) + '%'; }

// 核心计算入口（Node 冒烟测试亦调用此函数）
function compute(osuText, osrBytes) {
  const beatmap = parseOsu(osuText);
  const replay = parseOsr(new Uint8Array(osrBytes));
  const base = osrModsInfo(replay.mods);
  // 合并尾块独有 mod（位掩码装不下的 lazer mod，如 DC/DA）
  const active = [...base.active, ...replay.tailModsExtra];
  const mods = {
    ...base,
    active,
    list: active.map(m => m.code),
    blocking: active.filter(m => m.kind === 'ease' || m.kind === 'uncontrollable' || m.kind === 'auto').map(m => m.code),
  };
  const mapMd5 = md5(new TextEncoder().encode(osuText));
  const md5Ok = mapMd5 === replay.beatmapMd5;
  const res = judge(beatmap, replay, mods);
  return { beatmap, replay, mods, mapMd5, md5Ok, ...res };
}

function buildReport(c) {
  const { beatmap, replay, mods, md5Ok, acc, pack, category, courseName, difficulty, seg, sectionStats } = c;
  const lines = [];
  const titleLine = `${beatmap.artist} - ${beatmap.title} [${beatmap.version}]`;
  lines.push(`谱面: ${titleLine}`);
  lines.push(`回放: ${replay.player} @ ${new Date(Number(replay.timestamp / 10000n) - 62135596800000n).toISOString().slice(0, 19).replace('T', ' ')} | mods=[${mods.list.join(',') || '-'}] ${replay.version >= 30000000 ? '(lazer 回放)' : '(stable 回放)'}`);
  lines.push(`MD5 配对: ${md5Ok ? '一致' : '不一致！'} | ${beatmap.keys}K OD${beatmap.od} 物量${beatmap.notes.length}（LN ${beatmap.notes.filter(n => n.ln).length}）`);
  lines.push(`mods: ${mods.active.map(m => `${m.code}·${m.zh}`).join('，') || '无'}`);
  lines.push('');
  lines.push('== 准确率（整体）==');
  for (const [k, label] of SYS_LABELS) lines.push(`  ${label}: ${fmtAcc(acc[k].acc)}`);
  lines.push('');
  lines.push('== 细值（判定区间 ±ms 与计数）==');
  for (const k of detailSystems(pack)) {
    const label = (SYS_LABELS.find(x => x[0] === k) || [k, k])[1];
    const s = c.systems[k];
    const tiers = k.startsWith('m') ? MAL_TIERS : OSU_TIERS;
    lines.push(`  ${label}: ` + tiers.map(([tk, tn]) => `${tn} ±${(+s.windows[tk]).toFixed(1)}ms×${s.counts[tk]}`).join('，'));
  }
  lines.push('');
  lines.push(`== 段位包: ${courseName} | 难度: ${difficulty || '-'} ==`);
  if (pack) {
    const notice = verdictNotice(mods);
    if (notice) {
      lines.push(`  ${notice}`);
    } else {
      for (const t of pack.thresholds) {
        const got = acc[t.sys].acc;
        lines.push(`  ${t.note}: ${fmtAcc(got)} → ${got >= t.min ? 'PASS' : 'FAIL'}`);
      }
    }
  } else {
    lines.push('  非已知段位包：仅输出各判定体系计算值');
  }
  if (seg.split) {
    lines.push('');
    lines.push(`== 分段（空隙 ${seg.gaps.map(g => (g / 1000).toFixed(1) + 's').join(', ')} → ${sectionStats.length} 段）==`);
    for (const [k, label] of SYS_LABELS) {
      const row = sectionStats.map((s, i) => `${fmtAcc(s[k].acc)}(累计${fmtAcc(cumAcc(sectionStats, k, i))})`);
      lines.push(`  ${label}: ${row.join(' | ')}`);
    }
  }
  return lines.join('\n');
}

// 分段累计 acc（sumup）：把截至该段的判定计数合并后按体系公式整体计算
function cumAcc(sectionStats, key, upto) {
  if (key.startsWith('m')) {
    const t = { best: 0, cool: 0, good: 0, miss: 0 };
    for (let i = 0; i <= upto; i++) { const c = sectionStats[i][key].counts; t.best += c.best; t.cool += c.cool; t.good += c.good; t.miss += c.miss; }
    return malodyAcc(t).acc;
  }
  const t = { p: 0, g: 0, gd: 0, ok: 0, meh: 0, miss: 0 };
  for (let i = 0; i <= upto; i++) { const c = sectionStats[i][key].counts; for (const k in t) t[k] += c[k]; }
  return osuAcc(key, t).acc;
}

const OSU_TIERS = [
  ['p', 'MAX / PERFECT'], ['g', '300 / GREAT'], ['gd', '200 / GOOD'],
  ['ok', '100 / OK'], ['meh', '50 / MEH'], ['miss', 'MISS'],
];
const MAL_TIERS = [['best', 'BEST'], ['cool', 'COOL'], ['good', 'GOOD'], ['miss', 'MISS']];

// 细值：段位包 → 门槛相关体系；未分类 → 全部五体系。
// 每个体系给出判定窗口（±ms，随 OD 算出的实际值）与各档计数。
function detailSystems(pack) {
  return pack ? [...new Set(pack.thresholds.map(t => t.sys))] : ['stb', 'sv2', 'lzr', 'mc', 'mb'];
}

function detailCard(c, k) {
  const label = (SYS_LABELS.find(x => x[0] === k) || [k, k])[1];
  const s = c.systems[k];
  const isM = k.startsWith('m');
  const tiers = isM ? MAL_TIERS : OSU_TIERS;
  const rows = tiers.map(([tk, tn]) =>
    `<tr><td>${tn}</td><td class="num">±${(+s.windows[tk]).toFixed(1)} ms</td><td class="num">${s.counts[tk]}</td></tr>`).join('');
  return `<div class="detail-card"><div class="detail-title">${label} <span class="sub">acc ${fmtAcc(c.acc[k].acc)} · ${c.acc[k].n} 判定</span></div>` +
    `<table><tr><th>判定</th><th>窗口</th><th>计数</th></tr>${rows}</table></div>`;
}

// 过段禁用闸：命中降低难度/不可控/自动类 mod 时不提供通过判断（各体系计算值照常输出）
function verdictNotice(mods) {
  if (!mods.blocking.length) return null;
  const parts = mods.blocking.map(code => {
    const m = mods.active.find(x => x.code === code);
    return `${code}（${m ? m.zh.split(' ')[0] : ''}）`;
  });
  return `已使用 ${parts.join('、')}——属降低难度或不可控/自动类 mod，不提供过段判定；各体系计算值不受影响。`;
}

function render(c) {
  const $ = id => document.getElementById(id);
  $('map-info').textContent = `${c.beatmap.artist} - ${c.beatmap.title} [${c.beatmap.version}]`;
  $('map-meta').textContent = `${c.beatmap.keys}K · OD ${c.beatmap.od} · 物量 ${c.beatmap.notes.length}（LN ${c.beatmap.notes.filter(n => n.ln).length}）`;
  $('replay-info').textContent = `${c.replay.player} · mods [${c.mods.list.join(',') || '-'}] · ${c.replay.version >= 30000000 ? 'lazer' : 'stable'} 回放` +
    (c.replay.scoreInfo ? ` · ${c.replay.scoreInfo.client_version}` : '') +
    (c.replay.scoreInfo && Array.isArray(c.replay.scoreInfo.pauses) && c.replay.scoreInfo.pauses.length ? ` · 暂停 ${c.replay.scoreInfo.pauses.length} 次` : '');
  const rateChips = [];
  const rateModUsed = c.mods.active.some(m => ['DT', 'HT', 'NC'].includes(m.code));
  if (c.replay.scoreInfoRate != null && !rateModUsed) {
    rateChips.push(`<span class="mod-chip rate" title="倍率仅记录于 osr 尾块（LegacyReplaySoloScoreInfo），位掩码未含">变速 · 尾块倍率 ${c.replay.scoreInfoRate.toFixed(2)}×</span>`);
  }
  $('mods-line').innerHTML = [
    ...c.mods.active.map(m => {
      let zh = m.zh;
      if (['DT', 'HT', 'NC'].includes(m.code) && c.effectiveRate !== undefined) {
        zh = `${m.zh.split(' ')[0]} · 实测倍率 ${c.effectiveRate.toFixed(2)}×`;
      }
      return `<span class="mod-chip ${m.kind || ''}" title="${zh}">${m.code} · ${zh}</span>`;
    }),
    ...rateChips,
  ].join(' ') || '<span class="mod-chip">无 mod</span>';
  $('md5').textContent = c.md5Ok ? 'MD5 配对一致 ✓' : 'MD5 不一致 ✗（回放与谱面不是同一版本！）';
  $('md5').className = c.md5Ok ? 'ok' : 'bad';

  const accRows = SYS_LABELS.map(([k, label]) =>
    `<tr><td>${label}</td><td class="num">${fmtAcc(c.acc[k].acc)}</td><td class="num">${c.acc[k].n}</td></tr>`).join('');
  $('acc-body').innerHTML = accRows;

  const detailKeys = detailSystems(c.pack);
  $('details').innerHTML = detailKeys.map(k => detailCard(c, k)).join('');

  const emb = c.replay.counts;
  const lz = c.systems.lzr.counts;
  const delta = [lz.p - emb.geki, lz.g - emb.c300, lz.gd - emb.katu, lz.ok - emb.c100, lz.meh - emb.c50, lz.miss - emb.miss];
  $('reconcile').innerHTML =
    `<table><tr><th></th><th>P/MAX</th><th>300</th><th>200</th><th>100</th><th>50</th><th>miss</th></tr>` +
    `<tr><td>lzr 重判</td><td>${lz.p}</td><td>${lz.g}</td><td>${lz.gd}</td><td>${lz.ok}</td><td>${lz.meh}</td><td>${lz.miss}</td></tr>` +
    `<tr><td>osr 内嵌</td><td>${emb.geki}</td><td>${emb.c300}</td><td>${emb.katu}</td><td>${emb.c100}</td><td>${emb.c50}</td><td>${emb.miss}</td></tr>` +
    `<tr><td>Δ</td><td>${delta[0]}</td><td>${delta[1]}</td><td>${delta[2]}</td><td>${delta[3]}</td><td>${delta[4]}</td><td>${delta[5]}</td></tr></table>` +
    `<p class="hint">密集谱存在 ±10ms 级判定时钟/回放时钟量化差，Δ 有小残差属已知局限（见 TASK.md §10）。</p>`;

  $('pack-box').style.display = '';
  $('pack-name').textContent = c.courseName;
  $('pack-diff').textContent = c.difficulty || '-';
  const notice = verdictNotice(c.mods);
  if (!c.pack) {
    $('verdicts').innerHTML = '<p class="hint">非已知段位包：仅输出五体系计算值，无过段判定。</p>';
  } else if (notice) {
    $('verdicts').innerHTML = `<div class="verdict fail">${notice}</div>`;
  } else {
    $('verdicts').innerHTML = c.pack.thresholds.map(t => {
      const got = c.acc[t.sys].acc;
      return `<div class="verdict ${got >= t.min ? 'pass' : 'fail'}">${t.note}：<b>${fmtAcc(got)}</b> → ${got >= t.min ? '通过' : '未通过'}</div>`;
    }).join('');
  }
  $('sections').innerHTML = c.seg.split ? renderSections(c)
    : c.category === 'unknown-regular'
      ? '<p class="hint">无 Course 标识且无显著空隙，不分段。</p>'
      : '<p class="hint">未检测到显著空隙，按该 Course 的单曲处理（不分段）。</p>';
  $('results').style.display = 'block';
  state.lastCompute = c;
}

function sectionHeader(sectionStats) {
  return sectionStats.map((s, i) => `<th>段${i + 1}</th>`).join('');
}

function renderSections(c) {
  const rows = SYS_LABELS.map(([k, label]) =>
    `<tr><td>${label}</td>${c.sectionStats.map((s, i) => {
      const cum = cumAcc(c.sectionStats, k, i);
      return `<td class="num">${fmtAcc(s[k].acc)}<br><span class="sub">累计 ${fmtAcc(cum)}</span></td>`;
    }).join('')}</tr>`).join('');
  return `<table><tr><th>体系</th>${sectionHeader(c.sectionStats)}</tr>${rows}</table>`;
}

const state = { lastCompute: null };

if (typeof document !== 'undefined') {
  let osuFile = null, osrFile = null;

  function tryCompute() {
    if (osuFile && osrFile) {
      Promise.all([osuFile.text(), osrFile.arrayBuffer()]).then(([t, buf]) => {
        render(compute(t, buf));
      }).catch(e => {
        document.getElementById('md5').textContent = '解析失败：' + e.message;
        document.getElementById('md5').className = 'bad';
        document.getElementById('results').style.display = 'block';
      });
    }
  }

  function showFileName(key, file) {
    const el = document.getElementById(key + '-name');
    el.textContent = file ? file.name : '';
    el.title = file ? file.name : '';
  }

  document.getElementById('osu-input').addEventListener('change', e => {
    osuFile = e.target.files[0] || null;
    showFileName('osu', osuFile);
    tryCompute();
  });
  document.getElementById('osr-input').addEventListener('change', e => {
    osrFile = e.target.files[0] || null;
    showFileName('osr', osrFile);
    tryCompute();
  });

  const drop = document.getElementById('dropzone');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    for (const f of e.dataTransfer.files) {
      if (f.name.toLowerCase().endsWith('.osu')) { osuFile = f; showFileName('osu', f); }
      if (f.name.toLowerCase().endsWith('.osr')) { osrFile = f; showFileName('osr', f); }
    }
    tryCompute();
  });

  document.getElementById('copy-text').addEventListener('click', () => {
    if (state.lastCompute) navigator.clipboard.writeText(buildReport(state.lastCompute)).then(
      () => { document.getElementById('copy-text').textContent = '已复制'; },
      () => {});
  });
  document.getElementById('copy-json').addEventListener('click', () => {
    if (!state.lastCompute) return;
    const c = state.lastCompute;
    const out = {
      beatmap: { title: c.beatmap.title, version: c.beatmap.version, keys: c.beatmap.keys, od: c.beatmap.od },
      replay: { player: c.replay.player, mods: c.mods.list },
      md5Ok: c.md5Ok,
      acc: Object.fromEntries(Object.entries(c.acc).map(([k, v]) => [k, +(v.acc * 100).toFixed(4)])),
      course: { category: c.category, name: c.courseName, difficulty: c.difficulty },
      pack: c.pack ? { id: c.pack.id, name: c.pack.name, verdicts: c.pack.thresholds.map(t => ({ note: t.note, acc: +(c.acc[t.sys].acc * 100).toFixed(4), pass: c.acc[t.sys].acc >= t.min })) } : null,
    };
    navigator.clipboard.writeText(JSON.stringify(out, null, 2)).then(
      () => { document.getElementById('copy-json').textContent = '已复制'; },
      () => {});
  });
}
